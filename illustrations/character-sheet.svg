27.4 794.4Q530.9 793.8 531.6 790.3Z" fill="#fff" opacity="0.6533394105826074" transform="rotate(0 531.6 794.4)"/><path d="M678.9 470.1Q679.4 472.8 682.1 473.3Q679.4 473.8 678.9 476.5Q678.4 473.8 675.7 473.3Q678.4 472.8 678.9 470.1Z" fill="#fff" opacity="0.7816205312847716" transform="rotate(0 678.9 473.3)"/><text x="80" y="104" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#9B85FF">WOLOS · WONDERLAND OS</text><text x="80" y="160" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="50" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Meet the cast.</text><text x="80" y="200" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="20" fill="#B8B0D0">Five characters from Wonderland, each with a job to do in the system.</text><image href="white-rabbit.svg" x="70" y="226" width="600" height="600"/><text x="120" y="850" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="32.5" font-weight="700" fill="#FFFFFF">The White Rabbit<tspan font-weight="500" fill="#9B85FF" font-size="18.8" dx="12">guide</tspan></text><text x="120" y="885" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="20" fill="#D6D0E6">Curious, quick, always late, a little mad.</text><text x="120" y="916.2" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16.2" fill="#8C86A0">Setup Assistant · About · lock screen</text><rect x="740" y="230" width="380" height="350" rx="24" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".10"/><image href="keyhole.svg" x="815" y="232" width="230" height="230"/><text x="768" y="492" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">The Keyhole<tspan font-weight="500" fill="#9B85FF" font-size="15" dx="12">the way in</tspan></text><text x="768" y="520" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16" fill="#D6D0E6">The small door into Wonderland.</text><text x="768" y="541" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16" fill="#D6D0E6">Light comes through.</text><text x="768" y="566" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="13" fill="#8C86A0">About This Computer · sign-in</text><rect x="1160" y="230" width="380" height="350" rx="24" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".10"/><image href="cheshire.svg" x="1235" y="232" width="230" height="230"/><text x="1188" y="492" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">The Cheshire Cat<tspan font-weight="500" fill="#9B85FF" font-size="15" dx="12">thinking</tspan></text><text x="1188" y="520" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16" fill="#D6D0E6">Grins while the work happens.</text><text x="1188" y="541" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16" fill="#D6D0E6">Tail first, he vanishes.</text><text x="1188" y="566" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="13" fill="#8C86A0">loading and thinking states</text><rect x="740" y="600" width="380" height="350" rx="24" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".10"/><image href="pocket-watch.svg" x="815" y="602" width="230" height="230"/><text x="768" y="862" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">The Pocket Watch<tspan font-weight="500" fill="#9B85FF" font-size="15" dx="12">updating</tspan></text><text x="768" y="890" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16" fill="#D6D0E6">Opens up and shows you</text><text x="768" y="911" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16" fill="#D6D0E6">the gears turning.</text><text x="768" y="936" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="13" fill="#8C86A0">Software Update · progress</text><rect x="1160" y="600" width="380" height="350" rx="24" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".10"/><image href="teacup.svg" x="1235" y="602" width="230" height="230"/><text x="1188" y="862" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">The Teacup<tspan font-weight="500" fill="#9B85FF" font-size="15" dx="12">nothing here yet</tspan></text><text x="1188" y="890" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16" fill="#D6D0E6">Clean, empty, still warm.</text><text x="1188" y="911" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="16" fill="#D6D0E6">Pour something in.</text><text x="1188" y="936" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="13" fill="#8C86A0">empty states</text><text x="1540" y="982" text-anchor="end" font-family="Inter, 'Adwaita Sans', 'Fira Sans', sans-serif" font-size="14" fill="#6E6E80">© 2026 Julia Klee · Wonderland Brand License 1.0</text></svg>
