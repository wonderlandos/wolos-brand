# SPDX-License-Identifier: GPL-2.0-or-later
# WolOS Design System component spec (schema 1); see design/components/switch.toml for the template.
# Password field: written by DS-SPEC-A from the Kit as it draws today (kit_input.rs measures it).
schema = 1
id = "password-field"
name = "Password field"
category = "input"
status = "beta"
since = "0.12"
summary = "Takes a secret: it is masked, can be shown on request, and says when Caps Lock is on."
hig = "hig.md section 3 (Behaviour)"

[implementations.gtk]
api = "kit::widgets::password_field"
caps_lock = "kit::widgets::caps_lock_note"
css = "entry.text-field"
file = "crates/shell/src/kit/widgets.rs"

[anatomy]
field = "a text field whose characters are dots, with a peek icon"
note = "a line under the field that says the words Caps Lock is on, only while it is"

# The height of a text field.

[sizes.regular]
height = 24

[density.compact]
control = 20

[density.standard]
control = 24

[density.comfortable]
control = 32

[states]
empty = "Nothing typed; the placeholder shows."
filled = "Typed; the characters are masked."
caps = "Caps Lock is on: the note shows in words."
disabled = "The field cannot take input now."

[keyboard]
Tab = "Moves the focus into the field."
Enter = "Submits the secret (the surface decides)."
Escape = "Leaves the field."

[a11y]
gtk_role = "textbox"
web_role = "textbox"
wolkit_role = "textbox"
name = "The placeholder or the label next to it."
description = "The Caps Lock note, when shown."

[copy]
placeholder = "Password, or what the secret is for (Network password)."

[[rules]]
id = "RU-220"
kind = "do"
text = "A password field never shows what was typed unless the person asks (peek)."
enforced = "kit_input"

[[rules]]
id = "RU-221"
kind = "do"
text = "The Caps Lock note says so in words under the field, not only with an icon."
enforced = "kit_input"

[[rules]]
id = "RU-222"
kind = "dont"
text = "Do not put a secret in a text field, a log, a tooltip or a golden."
enforced = "manual"

[tests]
states = ["empty", "filled", "caps", "disabled"]
densities = ["standard"]
variants = ["light", "dark"]
